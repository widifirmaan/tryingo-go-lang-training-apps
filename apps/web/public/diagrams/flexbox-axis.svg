  <g fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="16" text-anchor="middle">
    <text x="165" y="160">Item 1</text>
    <text x="295" y="160">Item 2</text>
    <text x="425" y="160">Item 3</text>
  </g>
